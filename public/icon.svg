<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10696C" />
      <stop offset="55%" stop-color="#0E6466" />
      <stop offset="100%" stop-color="#05302F" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8910B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#021C1B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect width="512" height="512" rx="116" fill="url(#glow)" />

  <!-- Faint topographic rings + grid ticks -->
  <g fill="none" stroke="#F4F1EA">
    <circle cx="160" cy="430" r="150" stroke-opacity="0.06" stroke-width="3" stroke-dasharray="3 10" />
    <circle cx="420" cy="80" r="72" stroke-opacity="0.07" stroke-width="3" stroke-dasharray="3 10" />
  </g>
  <g stroke="#F4F1EA" stroke-opacity="0.12" stroke-width="2">
    <line x1="0" y1="150" x2="512" y2="140" />
    <line x1="0" y1="345" x2="512" y2="338" />
    <line x1="168" y1="0" x2="164" y2="512" />
    <line x1="360" y1="0" x2="364" y2="512" />
  </g>

  <!-- FLIGHT: gold dashed geodesic arc from the west -->
  <path d="M 84 296 C 190 260 296 212 382 164" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-dasharray="24 14" filter="url(#soft)" />
  <!-- Airplane riding the flight arc -->
  <g transform="translate(232, 254) rotate(-22)" filter="url(#soft)">
    <path d="M 0 -34 L 5 -15 C 22 -6 32 0 32 6 L 7 6 L 6 25 L 16 34 L 16 39 L 0 33 L -16 39 L -16 34 L -6 25 L -7 6 L -32 6 L -32 0 C -22 -6 -5 -15 0 -34 Z"
          fill="#FFFFFF" stroke="#F4F1EA" stroke-width="1.5" />
  </g>

  <!-- ROAD: solid bone route from the south-west -->
  <path d="M 100 478 C 148 436 200 420 250 392 C 306 360 348 302 372 196" fill="none" stroke="#F4F1EA" stroke-width="13" stroke-linecap="round" filter="url(#soft)" />
  <!-- Center dashes on the road -->
  <path d="M 100 478 C 148 436 200 420 250 392 C 306 360 348 302 372 196" fill="none" stroke="#0E6466" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="10 12" />
  <!-- Car on the road (top view) -->
  <g transform="translate(246, 396) rotate(-33)" filter="url(#soft)">
    <rect x="-11" y="-22" width="22" height="44" rx="7" fill="#FFFFFF" stroke="#F4F1EA" stroke-width="1.5" />
    <rect x="-8.5" y="-6" width="17" height="15" rx="3" fill="#0E6466" opacity="0.8" />
    <rect x="-7.5" y="16" width="15" height="6" rx="2.5" fill="#0E6466" opacity="0.45" />
  </g>

  <!-- HIKE: dotted footpath from the south-east -->
  <path d="M 444 476 C 420 430 414 384 402 344 C 388 300 380 260 380 224 C 380 204 382 188 386 174" fill="none" stroke="#F4F1EA" stroke-opacity="0.85" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="0.5 13" filter="url(#soft)" />
  <!-- Hiker striding the footpath -->
  <g transform="translate(416, 392) rotate(-14)" filter="url(#soft)">
    <g stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round" fill="none">
      <circle cx="1" cy="-27" r="6" fill="#FFFFFF" stroke="none" />
      <path d="M 0 -19 L -2 5" />
      <path d="M -2 5 L 10 23" />
      <path d="M -2 5 L -12 21" />
      <path d="M -1 -13 L 11 -5" />
      <path d="M -1 -13 L -11 -7" />
    </g>
  </g>

  <!-- Destination pin (topmost) -->
  <g transform="translate(396, 128)" filter="url(#soft)">
    <ellipse cx="0" cy="40" rx="16" ry="6" fill="#021C1B" opacity="0.35" />
    <path d="M 0 -30 C -16.5 -30 -30 -16.5 -30 0 C -30 22 0 40 0 40 C 0 40 30 22 30 0 C 30 -16.5 16.5 -30 0 -30 Z" fill="url(#gold)" stroke="#B45309" stroke-width="3" />
    <circle cx="0" cy="-1" r="10.5" fill="#F4F1EA" />
  </g>
</svg>
