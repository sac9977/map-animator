<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ============================================================
       MapAnimator icon — EDITABLE MASTER
       Canvas: 512x512, y grows DOWNWARD.
       Geometry map (all coordinates in this 512x512 space):
         • Origin waypoint (shared start of all 3 trails): (110, 402)
         • Destination pin tip (shared end of all 3 trails): (396, 168)
         • Road: straight line between those two points
         • Flight + trek arcs: mirrors of each other around the road
       After editing, regenerate every size from repo root:
         cd public
         for s in 512 192 180 48 32 16; do
           rsvg-convert -w $s -h $s icon.svg -o "icon-$s.png"
         done
         mv icon-512.png pwa-512x512.png
         mv icon-192.png pwa-192x192.png
         mv icon-180.png apple-touch-icon.png
         mv icon-48.png favicon-48.png
         mv icon-32.png favicon-32.png
         mv icon-16.png favicon-16.png
       ============================================================ -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10696C" />
      <stop offset="55%" stop-color="#0E6466" />
      <stop offset="100%" stop-color="#05302F" />
    </linearGradient>
    <radialGradient id="globe" cx="34%" cy="26%" r="85%">
      <stop offset="0%" stop-color="#1B7D80" />
      <stop offset="60%" stop-color="#0F676A" />
      <stop offset="100%" stop-color="#083A3B" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8910B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#021C1B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ================= TITLE ================= -->
  <g id="tile">
    <rect width="512" height="512" rx="116" fill="url(#bg)" />
    <rect width="512" height="512" rx="116" fill="url(#glow)" />
  </g>

  <!-- ================= GLOBE BACKDROP ================= -->
  <!-- Delete this whole <g> for a plain background.
       Center (256,268), radius 210. Meridians are ellipses, parallels are lines. -->
  <g id="globe">
    <circle cx="256" cy="268" r="210" fill="url(#globe)" />
    <g fill="none" stroke="#F4F1EA">
      <circle cx="256" cy="268" r="210" stroke-opacity="0.28" stroke-width="3" />
      <ellipse cx="256" cy="268" rx="70"  ry="210" stroke-opacity="0.14" stroke-width="2.5" />
      <ellipse cx="256" cy="268" rx="140" ry="210" stroke-opacity="0.14" stroke-width="2.5" />
      <line x1="62" y1="188" x2="450" y2="188" stroke-opacity="0.14" stroke-width="2.5" />
      <line x1="46" y1="268" x2="466" y2="268" stroke-opacity="0.18" stroke-width="2.5" />
      <line x1="62" y1="348" x2="450" y2="348" stroke-opacity="0.14" stroke-width="2.5" />
    </g>
  </g>

  <!-- ================= TRAIL 1: ROAD (center, straight) ================= -->
  <g id="trail-road">
    <path id="road-line" d="M 110 402 L 396 168" fill="none"
          stroke="#F4F1EA" stroke-width="13" stroke-linecap="round" filter="url(#soft)" />
    <path id="road-dashes" d="M 110 402 L 396 168" fill="none"
          stroke="#0E6466" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="10 12" />
    <!-- Car: top view, front = up. rotate() aims it along the road.
         First translate() value pair = position on the road. -->
    <g id="car" transform="translate(253,285) rotate(51)" filter="url(#soft)">
      <rect x="-11" y="-22" width="22" height="44" rx="7" fill="#FFFFFF" stroke="#F4F1EA" stroke-width="1.5" />
      <rect x="-8.5" y="-6" width="17" height="15" rx="3" fill="#0E6466" opacity="0.8" />
      <rect x="-7.5" y="16" width="15" height="6" rx="2.5" fill="#0E6466" opacity="0.45" />
    </g>
  </g>

  <!-- ================= TRAIL 2: FLIGHT (bowing up-left) ================= -->
  <g id="trail-flight">
    <path id="flight-arc" d="M 110 402 C 121 221 216 137 396 168" fill="none"
          stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-dasharray="24 14" filter="url(#soft)" />
    <!-- Airliner: nose = up before rotate(). scale 2.6 = size. -->
    <g id="plane" transform="translate(190,208) rotate(50)" filter="url(#soft)">
      <g transform="scale(2.6) translate(-11.5,-12)" fill="#FFFFFF" stroke="#F4F1EA" stroke-width="0.6">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </g>
    </g>
  </g>

  <!-- ================= TRAIL 3: TREK (bowing down-right) ================= -->
  <g id="trail-trek">
    <!-- Hollow "stepping stone" rings: 2st stroke punches a hole in the 1st -->
    <path id="trek-rings-outer" d="M 110 402 C 290 427 385 343 396 168" fill="none"
          stroke="#F4F1EA" stroke-opacity="0.9" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 13" filter="url(#soft)" />
    <path id="trek-rings-inner" d="M 110 402 C 290 427 385 343 396 168" fill="none"
          stroke="#0E6466" stroke-opacity="0.85" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="1 13" />
    <!-- Footprints: sit ~32px OUTSIDE (down-right of) the trek curve.
         Each print = toe pad + heel pad, drawn pointing UP, then rotate(50)
         aims the toes along the direction of travel. scale(0.85) = size. -->
    <g id="footprints" fill="#FFFFFF" stroke="#0E6466" stroke-opacity="0.4" stroke-width="2.5" filter="url(#soft)">
      <g id="footprint-back"  transform="translate(325,396) rotate(50) scale(0.85)">
        <ellipse cx="0" cy="-13" rx="8" ry="10.5" />
        <ellipse cx="0" cy="12"  rx="5.5" ry="7" />
      </g>
      <g id="footprint-front" transform="translate(348,377) rotate(50) scale(0.85)">
        <ellipse cx="0" cy="-13" rx="8" ry="10.5" />
        <ellipse cx="0" cy="12"  rx="5.5" ry="7" />
      </g>
    </g>
  </g>

  <!-- ================= SHARED ORIGIN WAYPOINT ================= -->
  <g id="origin" filter="url(#soft)">
    <circle cx="110" cy="402" r="19" fill="#F4F1EA" stroke="#0E6466" stroke-width="7" />
    <circle cx="110" cy="402" r="7" fill="#F59E0B" />
  </g>

  <!-- ================= DESTINATION PIN ================= -->
  <!-- The +40 in the tip (0,40) below is what the trails aim at (396,168). -->
  <g id="pin" transform="translate(396,128)" filter="url(#soft)">
    <ellipse cx="0" cy="40" rx="16" ry="6" fill="#021C1B" opacity="0.35" />
    <path d="M 0 -30 C -16.5 -30 -30 -16.5 -30 0 C -30 22 0 40 0 40 C 0 40 30 22 30 0 C 30 -16.5 16.5 -30 0 -30 Z"
          fill="url(#gold)" stroke="#B45309" stroke-width="3" />
    <circle cx="0" cy="-1" r="10.5" fill="#F4F1EA" />
  </g>
</svg>
