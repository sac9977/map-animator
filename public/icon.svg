<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10696C" />
      <stop offset="55%" stop-color="#0E6466" />
      <stop offset="100%" stop-color="#05302F" />
    </linearGradient>
    <radialGradient id="globe" cx="34%" cy="26%" r="85%">
      <stop offset="0%" stop-color="#1B7D80" />
      <stop offset="60%" stop-color="#0F676A" />
      <stop offset="100%" stop-color="#083A3B" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8910B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#021C1B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <rect width="512" height="512" rx="116" fill="url(#glow)" />

  <!-- Globe: sphere + graticule (same teal family) -->
  <circle cx="256" cy="268" r="210" fill="url(#globe)" />
  <g fill="none" stroke="#F4F1EA">
    <circle cx="256" cy="268" r="210" stroke-opacity="0.28" stroke-width="3" />
    <!-- meridians -->
    <ellipse cx="256" cy="268" rx="70" ry="210" stroke-opacity="0.14" stroke-width="2.5" />
    <ellipse cx="256" cy="268" rx="140" ry="210" stroke-opacity="0.14" stroke-width="2.5" />
    <!-- parallels + equator -->
    <line x1="62" y1="188" x2="450" y2="188" stroke-opacity="0.14" stroke-width="2.5" />
    <line x1="46" y1="268" x2="466" y2="268" stroke-opacity="0.18" stroke-width="2.5" />
    <line x1="62" y1="348" x2="450" y2="348" stroke-opacity="0.14" stroke-width="2.5" />
  </g>

  <!-- SHARED ORIGIN → ROAD: straight bone route through the icon's middle -->
  <path d="M 110 402 L 386 170" fill="none" stroke="#F4F1EA" stroke-width="13" stroke-linecap="round" filter="url(#soft)" />
  <!-- Road center dashes -->
  <path d="M 110 402 L 386 170" fill="none" stroke="#0E6466" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="10 12" />
  <!-- Car aligned to road direction -->
  <g transform="translate(248,286) rotate(50)" filter="url(#soft)">
    <rect x="-11" y="-22" width="22" height="44" rx="7" fill="#FFFFFF" stroke="#F4F1EA" stroke-width="1.5" />
    <rect x="-8.5" y="-6" width="17" height="15" rx="3" fill="#0E6466" opacity="0.8" />
    <rect x="-7.5" y="16" width="15" height="6" rx="2.5" fill="#0E6466" opacity="0.45" />
  </g>

  <!-- SHARED ORIGIN → FLIGHT: gold dashed geodesic (mirrors the trek around the road) -->
  <path d="M 110 402 C 150 280 240 200 386 170" fill="none" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-dasharray="24 14" filter="url(#soft)" />
  <!-- Airplane aligned to flight direction -->
  <g transform="translate(208,252) rotate(49)" filter="url(#soft)">
    <path d="M 0 -34 L 5 -15 C 22 -6 32 0 32 6 L 7 6 L 6 25 L 16 34 L 16 39 L 0 33 L -16 39 L -16 34 L -6 25 L -7 6 L -32 6 L -32 0 C -22 -6 -5 -15 0 -34 Z"
          fill="#FFFFFF" stroke="#F4F1EA" stroke-width="1.5" />
  </g>

  <!-- SHARED ORIGIN → HIKE: dotted footpath (mirror of the flight arc) -->
  <path d="M 110 402 C 237 384 331 309 386 170" fill="none" stroke="#F4F1EA" stroke-opacity="0.85" stroke-width="6.5" stroke-linecap="round" stroke-dasharray="0.5 13" filter="url(#soft)" />
  <!-- Two footprints striding, aligned to trail direction -->
  <g fill="#FFFFFF" stroke="#0E6466" stroke-opacity="0.4" stroke-width="2.5" filter="url(#soft)">
    <g transform="translate(269,345) rotate(50) scale(0.85)">
      <ellipse cx="0" cy="-13" rx="8" ry="10.5" />
      <ellipse cx="0" cy="12" rx="5.5" ry="7" />
    </g>
    <g transform="translate(279,313) rotate(50) scale(0.85)">
      <ellipse cx="0" cy="-13" rx="8" ry="10.5" />
      <ellipse cx="0" cy="12" rx="5.5" ry="7" />
    </g>
  </g>

  <!-- Shared origin waypoint -->
  <g filter="url(#soft)">
    <circle cx="108" cy="404" r="19" fill="#F4F1EA" stroke="#0E6466" stroke-width="7" />
    <circle cx="108" cy="404" r="7" fill="#F59E0B" />
  </g>

  <!-- Destination pin (topmost) -->
  <g transform="translate(396,128)" filter="url(#soft)">
    <ellipse cx="0" cy="40" rx="16" ry="6" fill="#021C1B" opacity="0.35" />
    <path d="M 0 -30 C -16.5 -30 -30 -16.5 -30 0 C -30 22 0 40 0 40 C 0 40 30 22 30 0 C 30 -16.5 16.5 -30 0 -30 Z" fill="url(#gold)" stroke="#B45309" stroke-width="3" />
    <circle cx="0" cy="-1" r="10.5" fill="#F4F1EA" />
  </g>
</svg>
