<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E6466" />
      <stop offset="100%" stop-color="#063233" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle topographic contour rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4" stroke-dasharray="12 12" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" />
  
  <!-- Curved travel route path -->
  <path d="M 120 370 Q 220 180 380 150" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" stroke-dasharray="24 16" />
  
  <!-- Start waypoint pin -->
  <circle cx="120" cy="370" r="18" fill="#F4F1EA" stroke="#0E6466" stroke-width="6" />
  <circle cx="120" cy="370" r="8" fill="#F59E0B" />
  
  <!-- Airplane icon along route -->
  <g transform="translate(260, 230) rotate(-28)">
    <path d="M 0 -35 L 8 -12 L 40 4 L 40 14 L 8 4 L 6 26 L 18 36 L 18 42 L 0 36 L -18 42 L -18 36 L -6 26 L -8 4 L -40 14 L -40 4 L -8 -12 Z" fill="#FFFFFF" />
  </g>
  
  <!-- End waypoint destination pin -->
  <g transform="translate(380, 150)">
    <circle cx="0" cy="0" r="22" fill="#F59E0B" />
    <path d="M 0 -24 C -13 -24 -24 -13 -24 0 C -24 18 0 38 0 38 C 0 38 24 18 24 0 C 24 -13 13 -24 0 -24 Z" fill="#F59E0B" />
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>
</svg>
